    <!-- Structured Data (Schema.org - FAQPage) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Quanto tempo demora o registro de marca?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O processo de registro de marca no INPI, em média, leva de 8 a 24 meses, podendo variar conforme existência de oposições de terceiros, exigências formais do INPI e recursos administrativos durante o processo. Apesar do prazo, o pedido já gera prioridade: a partir do protocolo, terceiros não podem registrar marca idêntica ou semelhante para o mesmo segmento."
          }
        },
        {
          "@type": "Question",
          "name": "Posso registrar uma marca que já está em uso?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. No Brasil, o sistema é baseado no princípio da anterioridade do pedido, isto é, quem deposita primeiro tem prioridade. Contudo, quem já utiliza a marca anteriormente pode ter direito de precedência, desde que comprove uso contínuo e de boa-fé, motivo pelo qual é essencial realizar uma busca de anterioridade antes do pedido."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a diferença entre marca nominativa, figurativa e mista?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Marca nominativa protege apenas o nome da marca, independentemente de fonte ou estilo visual. Marca figurativa protege somente o elemento visual, como símbolos, ícones ou logotipos sem texto. Marca mista protege a combinação entre nome e logotipo, forma mais comum no mercado. A escolha do tipo impacta diretamente no alcance da proteção jurídica."
          }
        },
        {
          "@type": "Question",
          "name": "O que acontece se minha marca for indeferida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Se o pedido for indeferido pelo INPI, ainda é possível apresentar recurso administrativo dentro do prazo legal, ajustar a estratégia de proteção por meio de novo pedido ou alteração da marca e avaliar o risco jurídico de uso continuado. O indeferimento não impede automaticamente o uso da marca, mas aumenta o risco de conflitos, notificações extrajudiciais e ações judiciais."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso renovar o registro de marca?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O registro de marca tem validade de 10 anos a partir da concessão e pode ser renovado indefinidamente por períodos sucessivos de 10 anos. A falta de renovação implica perda do direito exclusivo, permitindo que terceiros registrem a mesma marca."
          }
        }
      ]
    }
    </script>

        *{margin:0;padding:0;box-sizing:border-box;}
        html{
            scroll-behavior:smooth;
            scroll-padding-top: 100px;
        }
        body{
            font-family:Inter,system-ui,sans-serif;
            color:var(--texto);
            background: var(--bg-body);
            line-height:1.7;
            overflow-x:hidden;
            transition: background-color .3s ease, color .3s ease;
        }

        p { text-align: justify; }

        .liquid-bg{
            position:fixed;
            inset:-20%;
            z-index:-1;
            background:
                radial-gradient(1200px 800px at 10% 10%, rgba(212,163,55,.18), transparent 60%),
                radial-gradient(900px 700px at 90% 20%, rgba(15,76,92,.18), transparent 60%),
                radial-gradient(800px 600px at 30% 80%, rgba(212,163,55,.12), transparent 60%);
            filter: blur(40px) saturate(130%);
            animation: liquidFloat 20s ease-in-out infinite alternate;
            will-change: transform;
            transform: translateZ(0);
            transition: background .3s ease;
        }
        @keyframes liquidFloat{
            0%{transform:translate3d(0,0,0) scale(1);}
            100%{transform:translate3d(-4%,3%,0) scale(1.05);}
        }

        /* ===== PROGRESS BAR DE SCROLL ===== */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--azul), var(--dourado));
            z-index: 10001;
            transform-origin: left;
            transform: scaleX(0);
            transition: transform .1s ease;
            box-shadow: 0 2px 10px rgba(212,163,55,.5);
        }

        /* ===== TRANSIÇÃO DE PÁGINA ===== */
        .page-transition-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--azul), var(--dourado));
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s cubic-bezier(.4,0,.2,1);
        }

        .page-transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        header{
            position:fixed;
            top:16px;
            left:0;
            right:0;
            z-index:100;
            display:flex;
            justify-content:center;
            pointer-events:none;
        }
        
        .nav-pill{
            pointer-events:auto;
            width:calc(100% - 32px);
            max-width:1200px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:12px 22px;
            border-radius:999px;
            backdrop-filter: blur(28px) saturate(180%);
            background:var(--vidro);
            border:1px solid var(--borda-vidro);
            box-shadow:0 18px 40px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.8);
            transition: all .4s cubic-bezier(.4,0,.2,1);
            will-change: transform, box-shadow;
            transform: translateZ(0);
        }
        .nav-pill:hover{
            box-shadow:0 22px 56px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.9);
            transform: translateY(-1px) translateZ(0);
        }
        
        .brand{
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:600;
            color:var(--azul);
            transition: transform .3s cubic-bezier(.4,0,.2,1);
        }
        .brand:hover{
            transform: scale(1.02);
        }
        
        .brand img{
            width:30px;
            filter: drop-shadow(0 0 18px rgba(212,163,55,.7));
            animation: logoGlow 4s ease-in-out infinite;
            transition: filter .3s ease;
        }
        @keyframes logoGlow{
            0%,100%{filter: drop-shadow(0 0 10px rgba(212,163,55,.4));}
            50%{filter: drop-shadow(0 0 26px rgba(212,163,55,.9));}
        }
        
        nav a{
            position: relative;
            margin-left:16px;
            text-decoration:none;
            color:currentColor;
            opacity:.7;
            font-size:14px;
            transition: all .3s cubic-bezier(.4,0,.2,1);
        }
        nav a::after{
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--dourado);
            transition: all .3s cubic-bezier(.4,0,.2,1);
            transform: translateX(-50%);
        }
        nav a:hover{
            opacity:1;
            transform: translateY(-1px);
        }
        nav a:hover::after{
            width: 80%;
        }

        .menu-toggle{
            display:none;
            flex-direction:column;
            gap:5px;
            cursor:pointer;
            padding:8px;
            transition: transform .3s ease;
        }
        .menu-toggle:hover{
            transform: scale(1.1);
        }
        .menu-toggle span{
            width:24px;
            height:2px;
            background:var(--azul);
            transition: all .3s cubic-bezier(.4,0,.2,1);
            border-radius:2px;
        }
        .menu-toggle.active span:nth-child(1){transform:rotate(45deg) translate(7px,7px);}
        .menu-toggle.active span:nth-child(2){opacity:0;}
        .menu-toggle.active span:nth-child(3){transform:rotate(-45deg) translate(7px,-7px);}

        .mobile-menu{
            display:none;
            position:fixed;
            top:80px;
            left:16px;
            right:16px;
            background:var(--vidro);
            backdrop-filter: blur(28px) saturate(180%);
            border:1px solid var(--borda-vidro);
            border-radius:24px;
            padding:20px;
            box-shadow:0 18px 40px rgba(0,0,0,.14);
            z-index:99;
            opacity:0;
            transform:translateY(-20px);
            transition: all .4s cubic-bezier(.4,0,.2,1);
        }
        .mobile-menu.active{
            display:block;
            opacity:1;
            transform:translateY(0);
        }
        .mobile-menu a{
            display:block;
            padding:12px 16px;
            text-decoration:none;
            color:currentColor;
            border-radius:12px;
            margin-bottom:8px;
            transition: all .3s cubic-bezier(.4,0,.2,1);
            transform: translateX(0);
        }
        .mobile-menu a:hover{
            background:rgba(15,76,92,.1);
            transform: translateX(8px);
        }

        /* ===== BOTÕES FLUTUANTES (DESKTOP) ===== */

        .whatsapp-float,
        .instagram-float,
        .scroll-top{
            position:fixed;
            right:24px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:20px;
            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.95);
            box-shadow:0 18px 40px rgba(0,0,0,.18);
            transition: all .4s cubic-bezier(.4,0,.2,1);
            cursor: pointer;
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        .whatsapp-float{
            bottom:24px;
            width:60px;
            height:60px;
            z-index:999;
        }

        .instagram-float{
            bottom:94px;
            width:52px;
            height:52px;
            z-index:998;
        }

        .scroll-top{
            bottom:156px;
            width:52px;
            height:52px;
            z-index:997;
            opacity:0;
            visibility:hidden;
            transform: translateZ(0) scale(0.9);
        }

        .scroll-top.visible{
            opacity:0.9;
            visibility:visible;
            transform: translateZ(0) scale(1);
        }

        .whatsapp-float svg,
        .instagram-float svg,
        .scroll-top svg{
            width:24px;
            height:24px;
            fill: var(--azul);
            opacity: 0.9;
            transition: transform .3s ease, opacity .3s ease;
        }

        .whatsapp-float svg{ fill:#25D366; }
        .instagram-float svg{ fill:#e1306c; }

        .whatsapp-float:hover,
        .instagram-float:hover,
        .scroll-top:hover{
            transform: translateY(-4px) translateZ(0) scale(1.05);
            box-shadow:0 22px 50px rgba(0,0,0,.22);
        }

        .whatsapp-float:hover svg,
        .instagram-float:hover svg,
        .scroll-top:hover svg{
            transform: translateY(-1px);
            opacity: 1;
        }

        .whatsapp-float:active,
        .instagram-float:active,
        .scroll-top:active{
            transform: translateY(-1px) translateZ(0) scale(0.97);
        }

        .btn{
            position:relative;
            display:inline-block;
            padding:14px 34px;
            border-radius:999px;
            background:linear-gradient(135deg, rgba(15,76,92,.95), rgba(15,76,92,.8));
            color:#fff;
            text-decoration:none;
            font-weight:500;
            overflow:hidden;
            isolation:isolate;
            box-shadow:0 14px 34px rgba(0,0,0,.18);
            transition: all .4s cubic-bezier(.4,0,.2,1);
            cursor: pointer;
            border: none;
            will-change: transform;
            transform: translateZ(0);
        }
        .btn::before{
            content:"";
            position:absolute;
            inset:-40%;
            background: radial-gradient(300px 120px at var(--mx,50%) var(--my,50%), rgba(255,255,255,.45), transparent 60%);
            mix-blend-mode: screen;
            opacity:0;
            transition: opacity .3s ease;
        }
        .btn::after{
            content:"";
            position:absolute;
            inset:0;
            border-radius:999px;
            padding:2px;
            background:linear-gradient(135deg, rgba(212,163,55,.6), rgba(212,163,55,0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity:0;
            transition: opacity .3s ease;
        }
        .btn:hover{
            transform: translateY(-3px) scale(1.02) translateZ(0);
            box-shadow:0 24px 52px rgba(0,0,0,.25);
        }
        .btn:hover::before{opacity:1}
        .btn:hover::after{opacity:1}
        .btn:active{
            transform: translateY(-1px) scale(0.98) translateZ(0);
            box-shadow:0 12px 24px rgba(0,0,0,.2);
        }
        
        .btn.loading{
            pointer-events: none;
            opacity: 0.7;
        }
        .btn.loading::after{
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid transparent;
            border-top-color: #fff;
            border-radius: 50%;
            animation: btnSpin 0.6s linear infinite;
        }

            justify-content:center;
            font-size:22px;
            transition: all .4s cubic-bezier(.4,0,.2,1);
        }
        .diferencial-item:hover .diferencial-icon{
            transform: rotate(10deg) scale(1.15);
            box-shadow: 0 8px 20px rgba(212,163,55,.4);
        }
        .diferencial-content h3{
            font-size:16px;
            color:var(--azul);
            margin-bottom:6px;
            font-weight:600;
            transition: color .3s ease;
        }
        .diferencial-item:hover .diferencial-content h3{
            color: var(--dourado);
        }
        .diferencial-content p{
            font-size:14px;
            color:var(--cinza);
            line-height:1.5;
            margin:0;
        }

        .faq-item{
            background:rgba(255,255,255,.4);
            border-radius:18px;
            border:1px solid rgba(212,163,55,.15);
            margin-bottom:16px;
            overflow:hidden;
            transition: all .4s cubic-bezier(.4,0,.2,1);
        }
        .faq-item:hover{
            border-color:rgba(212,163,55,.4);
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
        }
        .faq-question{
            padding:20px 24px;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            user-select:none;
            width:100%;
            border:none;
            background:transparent;
            text-align:left;
            transition: padding .3s ease;
        }
        .faq-question:hover{
            padding-left: 28px;
        }
        .faq-question h3{
            font-size:17px;
            color:var(--azul);
            font-weight:600;
            margin:0;
            transition: color .3s ease;
        }
        .faq-question:hover h3{
            color: var(--dourado);
        }
        .faq-toggle{
            flex-shrink:0;
            width:28px;
            height:28px;
            border-radius:50%;
            background:rgba(15,76,92,.1);
            display:flex;
            align-items:center;
            justify-content:center;
            transition: all .4s cubic-bezier(.4,0,.2,1);
            font-size:20px;
            color:var(--azul);
        }
        .faq-item.active .faq-toggle{
            transform:rotate(135deg);
            background:var(--azul);
            color:#fff;
        }
        .faq-answer{
            max-height:0;
            overflow:hidden;
            transition: all .5s cubic-bezier(.4,0,.2,1);
        }
        .faq-item.active .faq-answer{
            max-height:800px;
            padding:0 24px 20px;
        }
        .faq-answer p{
            font-size:15px;
            color:#3f3f46;
            line-height:1.6;
            margin-bottom:10px;
        }
        .faq-answer p:last-child{
            margin-bottom:0;
        }

        .reveal{
            opacity:0; 
            transform: translateY(40px) scale(.97); 
            filter: blur(8px);
            will-change: transform, opacity;
        }
        .reveal.in{
            opacity:1; 
            transform:none; 
            filter:none; 
            transition: all 1s cubic-bezier(.22,.61,.36,1);
        }

        .parallax-title{
            will-change: transform; 
            transition: transform .15s ease-out;
        }

        .signature{
            text-align:center;
            padding:56px 20px 24px;
            font-size:14px;
            color:#8b8b8b;
            letter-spacing:.08em;
        }

        footer{text-align:center;padding:32px;color:#777;font-size:13px;}

        .form-field{
            margin-bottom:16px;
            position: relative;
        }
        .form-field label{
            display:block;
            font-size:14px;
            color:var(--cinza);
            margin-bottom:6px;
            transition: color .3s ease;
            font-weight: 500;
        }
        .form-field input,
        .form-field textarea{
            width:100%;
            padding:12px 14px;
            border-radius:12px;
            border:1.5px solid #d4d4d4;
            font-family:inherit;
            font-size:14px;
            outline:none;
            background:rgba(255,255,255,.95);
            transition: all .3s cubic-bezier(.4,0,.2,1);
        }
        .form-field input:focus,
        .form-field textarea:focus{
            border-color:var(--azul);
            box-shadow:0 0 0 3px rgba(15,76,92,.1);
            transform: translateY(-2px);
            background: #fff;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        .popup-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: var(--vidro);
            backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid var(--borda-vidro);
            border-radius: 28px;
            padding: 48px;
            max-width: 520px;
            width: calc(100% - 40px);
            box-shadow: 0 28px 64px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,.9);
            text-align: center;
            animation: popupSlideUp 0.5s cubic-bezier(.4,0,.2,1);
            position: relative;
        }

        @keyframes popupSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .popup-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 12px 32px rgba(34, 197, 94, 0.4);
            animation: checkmarkBounce 0.8s cubic-bezier(.4,0,.2,1);
        }

        @keyframes checkmarkBounce {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .popup-content h3 {
            color: var(--azul);
            font-size: 26px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .popup-content p {
            margin-bottom: 32px;
            color: var(--cinza);
            font-size: 16px;
            line-height: 1.6;
            text-align: center;
        }

        .popup-close {
            background: linear-gradient(135deg, var(--azul), #0a3a47);
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 8px 20px rgba(15, 76, 92, 0.3);
        }

        .popup-close:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 32px rgba(15, 76, 92, 0.5);
        }
        
        .popup-close:active {
            transform: translateY(-1px) scale(0.98);
        }

        @media(max-width:900px){
            nav{display:none;}
            .menu-toggle{display:flex;}
            .hero{padding-top:136px;}
            .bubble{padding:26px;}
            .hero h1{font-size:30px;}
            .hero p{font-size:16.5px;}
            .logo-full{opacity:.38;}
            .stats{grid-template-columns:1fr;}
            .diferenciais-grid{grid-template-columns:1fr;}

            .whatsapp-float{
                width:56px;
                height:56px;
                bottom:20px;
                right:20px;
            }
            .whatsapp-float svg{
                width:24px;
                height:24px;
            }

            .instagram-float{
                width:48px;
                height:48px;
                bottom:86px;
                right:20px;
            }
            .instagram-float svg{
                width:22px;
                height:22px;
            }

            .scroll-top{
                width:48px;
                height:48px;
                bottom:144px;
                right:20px;
            }
            .scroll-top svg{
                width:20px;
                height:20px;
            }

            .popup-content {
                padding: 36px 24px;
            }
            .popup-icon {
                width: 64px;
                height: 64px;
                font-size: 36px;
            }
            .popup-content h3 {
                font-size: 22px;
            }
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(212,163,55,.1);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--azul), var(--dourado));
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--dourado), var(--azul));
        }
    </style>
</head>

    <script>
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });
        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        const menuToggle = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        menuToggle.addEventListener('click', () => {
            const active = mobileMenu.classList.toggle('active');
            menuToggle.classList.toggle('active', active);
            menuToggle.setAttribute('aria-expanded', active ? 'true' : 'false');
        });
    </script>
